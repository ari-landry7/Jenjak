<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <template id="product-template">
        <article class="card-body">
            <h4><span class="product-name"></span> - Minimum <span class="product-price"></span></h4>
            
            <p class="product-description"></p>
        </article>
    </template>

    <header><h1>Shop Items</h1></header>
    <nav>
        <ul>
            <li class="active"><a href="index.html" class="active">Home</a></li>
            <li><a href="page1.html">Page 1</a></li>
            <li><a href="page2.html">Page 2</a></li>
            <li><a href="page3.html">Page 3</a></li>
        </ul>
    </nav>
    <div id="product-list"></div>

    <h1>Order Form</h1>

    <form action="https://api.staticforms.xyz/submit" method="POST">
        <input type="hidden" name="apiKey" value="YOUR_API_KEY">
        <input type="hidden" name="replyTo" value="@">

        <!-- Anti-spam honeypot field -->
        <input
        type="text"
        name="honeypot"
        style="display: none"
        tabindex="-1"
        autocomplete="off"
        >

        <div class="form-group">
            <label for="sticker-quantity">Goblin stickers Quantity:</label>
            <input type="number" id="sticker-quantity" name="sticker-quantity" value="0">
        </div>
        <div class="form-group">
            <label for="card-quantity">Holiday Cards Quantity:</label>
            <input type="number" id="cards-quantity" name="card-quantity" value="0">
        </div>

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="company">Company:</label>
            <input type="text" id="company" name="$company">
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
        </div>

        <div class="g-recaptcha" data-sitekey="YOUR_SITE_KEY"></div>
        <script src="https://www.google.com/recaptcha/api.js" async defer></script>

        <button type="submit">Send Message</button>
    </form>

    <script src="index.js"></script>
</body>
</html>
